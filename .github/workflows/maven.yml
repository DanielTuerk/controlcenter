# This workflow builds and tests the ControlCenter backend (Quarkus/Java).
# The frontend (Angular) is built as part of the Maven build via the "with-frontend" profile.
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controlcenter
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: DanielTuerk
          server-password: PACKAGES_READ_TOKEN

      - name: Build and test with Maven
        run: ./mvnw -B -U verify -Pwith-frontend -Dquarkus.native.enabled=true
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
