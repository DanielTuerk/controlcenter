# Builds native (Mandrel) executables for Linux (x86_64 + aarch64) and Windows on every push to
# master, and uploads them as downloadable workflow artifacts (Actions tab -> run -> Artifacts).

name: Native Build

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Build native executable (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controlcenter
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: DanielTuerk
          server-password: PACKAGES_READ_TOKEN

      - name: Set up Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Build native executable
        # No container-build here: native-image runs directly on the runner
        # using the Mandrel toolchain set up above.
        run: ./mvnw -B -U clean package -Dquarkus.native.enabled=true -Pwith-frontend
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Rename artifact
        run: |
          mkdir -p release
          cp target/*-runner "release/controlcenter-linux-x86_64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlcenter-linux-x86_64
          path: release/controlcenter-linux-x86_64
          retention-days: 14

  native-linux-arm64:
    name: Build native executable (Linux arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout controlcenter
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: DanielTuerk
          server-password: PACKAGES_READ_TOKEN

      - name: Set up Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Build native executable
        # No container-build here: native-image runs directly on the runner
        # using the Mandrel toolchain set up above.
        run: ./mvnw -B -U clean package -Dquarkus.native.enabled=true -Pwith-frontend
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Rename artifact
        run: |
          mkdir -p release
          cp target/*-runner "release/controlcenter-linux-aarch64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlcenter-linux-aarch64
          path: release/controlcenter-linux-aarch64
          retention-days: 14

  native-windows:
    name: Build native executable (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout controlcenter
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: DanielTuerk
          server-password: PACKAGES_READ_TOKEN

      - name: Set up Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native executable
        # No container-build here: native-image runs directly on the runner
        # using the Mandrel/MSVC toolchain set up above.
        # pom.xml defaults quarkus.native.container-build to true (for the Linux
        # container build); override it here since Windows can't use that container.
        run: .\mvnw.cmd -B -U clean package "-Dquarkus.native.enabled=true" "-Dquarkus.native.container-build=false" -Pwith-frontend
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Rename artifact
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target\*-runner.exe "release\controlcenter-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: controlcenter-windows-x86_64
          path: release/controlcenter-windows-x86_64.exe
          retention-days: 14
