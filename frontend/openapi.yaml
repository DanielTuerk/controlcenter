---
openapi: 3.1.0
components:
  schemas:
    AbstractTrackPart:
      type: object
      required:
      - trackPartType
      oneOf:
      - $ref: "#/components/schemas/BlockStraight"
      - $ref: "#/components/schemas/Straight"
      - $ref: "#/components/schemas/Curve"
      - $ref: "#/components/schemas/Signal"
      - $ref: "#/components/schemas/Turnout"
      - $ref: "#/components/schemas/Uncoupler"
      discriminator:
        propertyName: trackPartType
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        gridPosition:
          $ref: "#/components/schemas/GridPosition"
        trackPartType:
          type: string
        rotationAngle:
          type: number
          format: double
    Add:
      type: object
      required:
      - trackPart
      properties:
        trackPart:
          $ref: "#/components/schemas/AbstractTrackPart"
    AvailableDevice:
      type: object
      properties:
        port:
          type: string
        name:
          type: string
    BlockStraight:
      type: object
      description: type for a track part
      allOf:
      - $ref: "#/components/schemas/Straight"
      properties:
        blockLength:
          type: integer
          format: int32
        leftTrackBlock:
          $ref: "#/components/schemas/TrackBlock"
        middleTrackBlock:
          $ref: "#/components/schemas/TrackBlock"
        rightTrackBlock:
          $ref: "#/components/schemas/TrackBlock"
        endGridPosition:
          $ref: "#/components/schemas/GridPosition"
        allGridPositions:
          type: array
          items:
            $ref: "#/components/schemas/GridPosition"
        gridLength:
          type: integer
          format: int32
        allTrackBlocks:
          type: array
          items:
            $ref: "#/components/schemas/TrackBlock"
        displayValue:
          type: string
    BusBitDto:
      type: object
      properties:
        bus:
          type: integer
          format: int32
        address:
          type: integer
          format: int32
        bit:
          type: integer
          format: int32
        state:
          type: boolean
    BusDataConfiguration:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        bus:
          type: integer
          format: int32
        address:
          type: integer
          format: int32
        bit:
          type: integer
          format: int32
        bitState:
          type: boolean
    BusDataDto:
      type: object
      properties:
        bus:
          type: integer
          format: int32
        address:
          type: integer
          format: int32
        value:
          type: integer
          format: int32
    BusDataEvent:
      type: object
      description: bus data update sent via WebSocket
      properties:
        bus:
          type: integer
          format: int32
        address:
          type: integer
          format: int32
        data:
          type: integer
          format: int32
        cacheKey:
          type: string
    ChangeTrackDto:
      type: object
      properties:
        addActions:
          type: array
          items:
            $ref: "#/components/schemas/Add"
        moveActions:
          type: array
          items:
            $ref: "#/components/schemas/Move"
        rotateActions:
          type: array
          items:
            $ref: "#/components/schemas/Rotate"
        empty:
          type: boolean
    ConfigItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    Construction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        name:
          type: string
        inAutomaticMode:
          type: boolean
    ConstructionDataChangedEvent:
      type: object
      description: Construction update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    ConstructionDto:
      type: object
      properties:
        name:
          type: string
    CurrentConstructionChangeEvent:
      type: object
      required:
      - construction
      description: Train status update sent via WebSocket
      properties:
        cacheKey:
          type: string
        construction:
          $ref: "#/components/schemas/Construction"
    Curve:
      type: object
      required:
      - trackPartType
      description: type for a track part
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        gridPosition:
          $ref: "#/components/schemas/GridPosition"
        trackPartType:
          type: string
        direction:
          $ref: "#/components/schemas/DIRECTION1"
        nextGridPosition:
          $ref: "#/components/schemas/GridPosition"
        lastGridPosition:
          $ref: "#/components/schemas/GridPosition"
        rotationAngle:
          type: number
          format: double
    DEVICE_TYPE:
      type: string
      enum:
      - SERIAL
      - TEST
    DIRECTION:
      type: string
      enum:
      - HORIZONTAL
      - VERTICAL
    DIRECTION1:
      type: string
      enum:
      - BOTTOM_RIGHT
      - BOTTOM_LEFT
      - TOP_LEFT
      - TOP_RIGHT
    DIRECTION2:
      type: string
      enum:
      - RIGHT
      - LEFT
    DRIVING_DIRECTION:
      type: string
      enum:
      - FORWARD
      - BACKWARD
    DRIVING_DIRECTION1:
      type: string
      enum:
      - FORWARD
      - BACKWARD
    DRIVING_LEVEL_ADJUST_TYPE:
      type: string
      enum:
      - NONE
      - ENTER
      - EXIT
    DeviceConnectionEvent:
      type: object
      description: bus status update sent via WebSocket
      properties:
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"
        eventType:
          $ref: "#/components/schemas/TYPE"
        cacheKey:
          type: string
    DeviceDataChangedEvent:
      type: object
      description: Device update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    DeviceInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        key:
          type: string
        type:
          $ref: "#/components/schemas/DEVICE_TYPE"
        connected:
          type: boolean
    DeviceInfoEvent:
      type: object
      description: bus status update sent via WebSocket
      properties:
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"
        eventType:
          $ref: "#/components/schemas/TYPE1"
    EventConfiguration:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        stateOnConfig:
          $ref: "#/components/schemas/BusDataConfiguration"
        stateOffConfig:
          $ref: "#/components/schemas/BusDataConfiguration"
    FUNCTION:
      type: string
      enum:
      - HP0
      - HP1
      - HP2
      - HP0_SH1
    FeedbackBlockEvent:
      type: object
      description: bus status update sent via WebSocket
      properties:
        bus:
          type: integer
          format: int32
        address:
          type: integer
          format: int32
        block:
          type: integer
          format: int32
        train:
          type: integer
          format: int32
        direction:
          type: boolean
        state:
          $ref: "#/components/schemas/STATE"
        cacheKey:
          type: string
    GridPosition:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        x:
          type: integer
          format: int32
        "y":
          type: integer
          format: int32
    MODE:
      type: string
      enum:
      - "OFF"
      - MANUAL
      - AUTOMATIC
    Move:
      type: object
      required:
      - trackPartId
      - gridPosition
      properties:
        trackPartId:
          type: integer
          format: int64
        gridPosition:
          $ref: "#/components/schemas/GridPosition"
    PRESENTATION:
      type: string
      enum:
      - LEFT_TO_RIGHT
      - RIGHT_TO_LEFT
      - BOTTOM_TO_TOP
      - TOP_TO_BOTTOM
    PlayerEvent:
      type: object
      description: bus status update sent via WebSocket
      properties:
        cacheKey:
          type: string
        state:
          $ref: "#/components/schemas/STATE1"
    ROUTE_RUN_STATE:
      type: string
      enum:
      - PREPARED
      - RESERVED
      - RUNNING
      - FINISHED
      - FAILED
    RUN_STATE:
      type: string
      enum:
      - RUNNING
      - IDLE
      - PAUSED
      - STOPPED
      - SUCCESS
      - ERROR
    RailVoltageEvent:
      type: object
      description: railvoltage status update sent via WebSocket
      properties:
        cacheKey:
          type: string
        state:
          type: boolean
    RecordingEvent:
      type: object
      description: bus status update sent via WebSocket
      properties:
        cacheKey:
          type: string
        state:
          $ref: "#/components/schemas/STATE2"
        filePath:
          type: string
    Rotate:
      type: object
      required:
      - trackPartId
      properties:
        trackPartId:
          type: integer
          format: int64
        value:
          type: string
    Route:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        name:
          type: string
        start:
          $ref: "#/components/schemas/BlockStraight"
        end:
          $ref: "#/components/schemas/TrackBlock"
        oneway:
          type: boolean
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/GridPosition"
        runState:
          $ref: "#/components/schemas/ROUTE_RUN_STATE"
        track:
          $ref: "#/components/schemas/Track"
        allTrackBlocksToDrive:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TrackBlock"
    RouteSequence:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        position:
          type: integer
          format: int32
        route:
          $ref: "#/components/schemas/Route"
        endDelayInSeconds:
          type: integer
          format: int32
    RouteStateEvent:
      type: object
      description: scenario status update sent via WebSocket
      properties:
        scenarioId:
          type: integer
          format: int64
        routeSequenceId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ROUTE_RUN_STATE"
        message:
          type: string
        cacheKey:
          type: string
    RoutesChangedEvent:
      type: object
      description: scenario status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    STATE:
      type: string
      enum:
      - ENTER
      - EXIT
    STATE1:
      type: string
      enum:
      - START
      - STOP
    STATE2:
      type: string
      enum:
      - START
      - STOP
    STATE3:
      type: string
      enum:
      - UNKNOWN
      - FREE
      - USED
    SYSTEM_FORMAT:
      type: string
      enum:
      - UNKNOWN
      - ONLY_SX1
      - SX1_SX2
      - SX1_SX2_DCC
      - ONLY_DCC
      - SX1_SX2_MM
      - ONLY_MM
      - SX1_SX2_DCC_MM
    Scenario:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        name:
          type: string
        cron:
          type: string
        train:
          $ref: "#/components/schemas/Train"
        trainDrivingDirection:
          $ref: "#/components/schemas/DRIVING_DIRECTION1"
        startDrivingLevel:
          type: integer
          format: int32
        routeSequences:
          type: array
          items:
            $ref: "#/components/schemas/RouteSequence"
        stationPlatformStartId:
          type: integer
          format: int64
        stationPlatformEndId:
          type: integer
          format: int64
        runState:
          $ref: "#/components/schemas/RUN_STATE"
        mode:
          $ref: "#/components/schemas/MODE"
    ScenarioDataChangedEvent:
      type: object
      description: scenario status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    ScenarioStateEvent:
      type: object
      description: scenario status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        cacheKey:
          type: string
        state:
          $ref: "#/components/schemas/RUN_STATE"
        nextScheduleTimeText:
          type: string
    Signal:
      type: object
      description: type for a track part
      allOf:
      - $ref: "#/components/schemas/Straight"
      properties:
        type:
          $ref: "#/components/schemas/TYPE3"
        signalConfigRed1:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigRed2:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigGreen1:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigGreen2:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigYellow1:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigYellow2:
          $ref: "#/components/schemas/BusDataConfiguration"
        signalConfigWhite:
          $ref: "#/components/schemas/BusDataConfiguration"
        stopBlock:
          $ref: "#/components/schemas/TrackBlock"
        signalConfigurations:
          type: array
          items:
            $ref: "#/components/schemas/BusDataConfiguration"
    SignalFunctionStateEvent:
      type: object
      description: track status update sent via WebSocket
      properties:
        signalId:
          type: integer
          format: int64
        signalFunction:
          $ref: "#/components/schemas/FUNCTION"
        cacheKey:
          type: string
    StationBoardChangedEvent:
      type: object
      description: station status update sent via WebSocket
      properties:
        type:
          $ref: "#/components/schemas/TYPE2"
        stationId:
          type: integer
          format: int64
    StationDataChangedEvent:
      type: object
      description: station status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    Straight:
      type: object
      required:
      - trackPartType
      description: type for a track part
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        gridPosition:
          $ref: "#/components/schemas/GridPosition"
        trackPartType:
          type: string
        direction:
          $ref: "#/components/schemas/DIRECTION"
    SystemFormatEvent:
      type: object
      description: system format update sent via WebSocket
      properties:
        cacheKey:
          type: string
        systemFormat:
          $ref: "#/components/schemas/SYSTEM_FORMAT"
    TYPE:
      type: string
      enum:
      - CONNECTED
      - DISCONNECTED
    TYPE1:
      type: string
      enum:
      - CREATE
      - REMOVE
      - MODIFY
    TYPE2:
      type: string
      enum:
      - ARRIVAL
      - DEPARTURE
    TYPE3:
      type: string
      enum:
      - BLOCK
      - ENTER
      - EXIT
      - BEFORE
    Track:
      type: object
      properties:
        trackBlocks:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TrackBlock"
        trackFunctions:
          type: array
          items:
            $ref: "#/components/schemas/BusDataConfiguration"
        gridPositions:
          type: array
          items:
            $ref: "#/components/schemas/GridPosition"
        length:
          type: integer
          format: int32
    TrackBlock:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        blockFunction:
          $ref: "#/components/schemas/BusDataConfiguration"
        construction:
          $ref: "#/components/schemas/Construction"
        name:
          type: string
        forwardTargetDrivingLevel:
          type: integer
          format: int32
        backwardTargetDrivingLevel:
          type: integer
          format: int32
        drivingLevelAdjustType:
          $ref: "#/components/schemas/DRIVING_LEVEL_ADJUST_TYPE"
        feedback:
          type: boolean
        displayValue:
          type: string
    TrackBlockDataChangedEvent:
      type: object
      description: Track-block update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    TrackChangedEvent:
      type: object
      description: Track update sent via WebSocket
      properties:
        dirty:
          type: boolean
    TrackPartBlockEvent:
      type: object
      description: track status update sent via WebSocket
      properties:
        config:
          $ref: "#/components/schemas/BusDataConfiguration"
        state:
          $ref: "#/components/schemas/STATE3"
        cacheKey:
          type: string
    TrackPartDataChangedEvent:
      type: object
      description: Track-part update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    TrackPartStateEvent:
      type: object
      description: track status update sent via WebSocket
      properties:
        configuration:
          $ref: "#/components/schemas/BusDataConfiguration"
        state:
          type: boolean
        trackPartId:
          type: integer
          format: int64
        "on":
          type: boolean
        cacheKey:
          type: string
    Train:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        currentBlocks:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TrackBlock"
        address:
          type: integer
          format: int32
        name:
          type: string
        functions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TrainFunction"
        drivingLevel:
          type: integer
          format: int32
        forward:
          type: boolean
        addressByte:
          type: integer
          format: int8
        presentOnTrack:
          type: boolean
    TrainDataChangedEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
    TrainDrivingDirectionEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        cacheKey:
          type: string
        direction:
          $ref: "#/components/schemas/DRIVING_DIRECTION"
    TrainDrivingLevelEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        cacheKey:
          type: string
        speed:
          type: integer
          format: int32
    TrainDto:
      type: object
      properties:
        name:
          type: string
        address:
          type: integer
          format: int32
    TrainFunction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        alias:
          type: string
        configuration:
          $ref: "#/components/schemas/BusDataConfiguration"
        active:
          type: boolean
    TrainFunctionStateEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        function:
          $ref: "#/components/schemas/TrainFunction"
        active:
          type: boolean
        cacheKey:
          type: string
    TrainHornStateEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        cacheKey:
          type: string
        state:
          type: boolean
    TrainLightStateEvent:
      type: object
      description: Train status update sent via WebSocket
      properties:
        itemId:
          type: integer
          format: int64
        cacheKey:
          type: string
        state:
          type: boolean
    Turnout:
      type: object
      required:
      - trackPartType
      description: type for a track part
      properties:
        id:
          type: integer
          format: int64
        internalId:
          type: integer
          deprecated: true
          format: int64
        gridPosition:
          $ref: "#/components/schemas/GridPosition"
        trackPartType:
          type: string
        currentDirection:
          $ref: "#/components/schemas/DIRECTION2"
        currentPresentation:
          $ref: "#/components/schemas/PRESENTATION"
        toggleFunction:
          $ref: "#/components/schemas/BusDataConfiguration"
        eventConfiguration:
          $ref: "#/components/schemas/EventConfiguration"
        nextGridPositionForStateBranchToLeft:
          $ref: "#/components/schemas/GridPosition"
        nextGridPositionForStateBranchToRight:
          $ref: "#/components/schemas/GridPosition"
    Uncoupler:
      type: object
      description: type for a track part
      allOf:
      - $ref: "#/components/schemas/Straight"
      properties:
        toggleFunction:
          $ref: "#/components/schemas/BusDataConfiguration"
        eventConfiguration:
          $ref: "#/components/schemas/EventConfiguration"
    WsClient:
      type: object
      properties:
        clientId:
          type: string
tags:
- name: Websocket DTOs
paths:
  /api/bus/bus-bit:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusBitDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Bus Data
      tags:
      - Bus Resource
  /api/bus/bus-data:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusDataDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Bus Data
      tags:
      - Bus Resource
  /api/bus/railvoltage:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Update Rail Voltage
      tags:
      - Bus Resource
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: boolean
      summary: Fetch Railvoltage State
      tags:
      - Bus Resource
  /api/bus/start-tracking-bus:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WsClient"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Start Tracking Bus
      tags:
      - Bus Resource
  /api/bus/stop-tracking-bus:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WsClient"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
      summary: Stop Tracking Bus
      tags:
      - Bus Resource
  /api/bus/system-format:
    post:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Switch System Format
      tags:
      - Bus Resource
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SYSTEM_FORMAT"
      summary: Fetch System Format State
      tags:
      - Bus Resource
  /api/config:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: "#/components/schemas/ConfigItem"
      summary: List All
      tags:
      - Config Resource
  /api/config/{key}:
    put:
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: Update
      tags:
      - Config Resource
    get:
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain: {}
      summary: Load Value
      tags:
      - Config Resource
  /api/constructions:
    get:
      responses:
        "200":
          description: OK
