<mat-card appearance="outlined" class="container">
  <mat-card-header>
  </mat-card-header>
  <mat-card-content>
    <p>
      <button mat-stroked-button routerLink="create">
        <mat-icon>add</mat-icon>
        Create
      </button>
    </p>
    <table mat-table [dataSource]="trackBlocks()" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id</th>
        <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef> Address</th>
        <td mat-cell *matCellDef="let element"> {{ element.blockFunction.address }}</td>
      </ng-container>

      <ng-container matColumnDef="bit">
        <th mat-header-cell *matHeaderCellDef> Bit</th>
        <td mat-cell *matCellDef="let element"> {{ element.blockFunction.bit }}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let trackBlock">
          <button mat-icon-button [routerLink]="[trackBlock.id]"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button (click)="deleteBlock(trackBlock)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let _row; columns: displayedColumns;"></tr>
    </table>

  </mat-card-content>
</mat-card>
