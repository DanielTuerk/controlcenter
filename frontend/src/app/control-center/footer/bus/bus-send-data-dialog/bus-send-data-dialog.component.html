<h2 mat-dialog-title>Send Bus data</h2>

<mat-dialog-content [formGroup]="form">
  <mat-form-field>
    <mat-label>Bus</mat-label>
    <input matInput formControlName="bus" type="number">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Address</mat-label>
    <input matInput formControlName="address" type="number">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Value</mat-label>
    <input matInput formControlName="value" type="number">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="onCancel()">Cancel</button>
  <button matButton color="primary" (click)="onSend()">Send</button>
</mat-dialog-actions>
