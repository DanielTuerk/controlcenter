  <button mat-stroked-button
          [matTooltip]="'change system format'"
          [textContent]="systemFormat()"
          [disabled]="!isConnected()"
          (click)="onSystemFormat()"></button>

  <button mat-icon-button
          [matTooltip]="'toggle rail voltage'"
          [disabled]="!isConnected()"
          (click)="onRailVoltageToggle()">
    @if (railVoltageEnabled()) {
      <span class="voltage-off"><mat-icon>electric_bolt</mat-icon></span>
    } @else {
      <span class="voltage-on"><mat-icon>electric_bolt</mat-icon></span>
    }
  </button>

  <button mat-icon-button routerLink="bus-monitor"
          [matTooltip]="'open bus monitor'"
          [disabled]="!isConnected()">
    <mat-icon>monitor</mat-icon>
  </button>
  <button mat-icon-button
          [matTooltip]="'send bus data'"
          [disabled]="!isConnected()"
          (click)="sendBusData()">
    <mat-icon>send</mat-icon>
  </button>
