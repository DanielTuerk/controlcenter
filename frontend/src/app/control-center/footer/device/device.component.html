<mat-form-field class="no-subscript">
  <mat-label>Select device</mat-label>
  <mat-select [(ngModel)]="selectedDevice"
    [disabled]="isConnected()"
    name="device">
    @for (device of devices(); track device; let i = $index) {
      <mat-option [value]="device">{{ device.key }}</mat-option>
    }
  </mat-select>
</mat-form-field>
<button mat-fab routerLink="settings/device" [disabled]="isConnected()">
  <mat-icon>edit</mat-icon>
</button>
<mat-slide-toggle [checked]="isConnected()"
  [disabled]="!selectedDevice"
  (change)="onConnectionToggle($event.checked)">Connection
</mat-slide-toggle>
