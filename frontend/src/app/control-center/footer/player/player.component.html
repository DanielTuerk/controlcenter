<button mat-icon-button

        (click)="onRecordingToggle()"
        [matTooltip]="'record bus to file'">
  <mat-icon style="color: rgb(207 102 102 / 0.58)">radio_button_checked</mat-icon>
</button>
<button mat-icon-button
        [disabled]="!isConnected()"

  <mat-icon>play_circle</mat-icon>
</button>
