<br/>
<mat-card appearance="outlined" class="container">
  <mat-card-header>
    <mat-card-title>Edit Station</mat-card-title>
  </mat-card-header>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-card-content>
      <div class="form-row">
        <label>Name: </label>
        <mat-form-field>
          <input matInput required [formControl]="form.controls.name"/>
        </mat-form-field>
      </div>

      <div class="form-row" style="align-items: flex-start; max-width: 900px">
        <label style="padding-top: 5px;">Platforms: </label>
        <div style="width: 100%">
          <button type="button" matMiniFab (click)="addPlatform()">
            <mat-icon>add</mat-icon>
          </button>

          @for (platform of station().platforms; track platform.id) {
            <div class="platform-row">
              <div class="form-row">
                <label>Name: </label>
                <mat-form-field>
                  <input matInput placeholder="platform name" [value]="platform.name"
                         (change)="updatePlatformName(platform, $any($event.target).value)"/>
                </mat-form-field>
                <mat-icon (click)="removePlatform(platform)">delete</mat-icon>
              </div>

              <div class="form-row">
                <label>Block straights: </label>
                <mat-form-field>
                  <mat-select #blockStraightSelect placeholder="select block straight to add ...">
                    @for (opt of blockStraights(); track opt.id) {
                      <mat-option [value]="opt"> {{ opt.displayValue }}</mat-option>
                    }
                  </mat-select>
                </mat-form-field>
                <button type="button" matMiniFab (click)="addBlockStraight(platform, blockStraightSelect.value)">
                  <mat-icon>add</mat-icon>
                </button>
              </div>

              <mat-list style="align-content: center">
                @for (blockStraight of platform.blockStraights; track blockStraight.id) {
                  <mat-list-item> {{ blockStraight.displayValue }}
                    <mat-icon (click)="removeBlockStraight(platform, blockStraight)">delete</mat-icon>
                  </mat-list-item>
                }
              </mat-list>
            </div>
          }
        </div>
      </div>
    </mat-card-content>
    <mat-card-footer>
      <button matButton="outlined" type="button" routerLink="/cc/scenario" fragment="stations">Back</button>
      <button matButton="outlined">Apply</button>
    </mat-card-footer>
  </form>
</mat-card>
