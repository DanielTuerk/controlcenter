<mat-card appearance="outlined" class="container">
  <mat-card-header>
    <mat-card-title>Stations</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      <button matButton="outlined" routerLink="station/create">
        <mat-icon>add</mat-icon>
        Create
      </button>
    </p>
    <table mat-table [dataSource]="stations()" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let station">
          <button matIconButton [routerLink]="['station', station.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button matIconButton (click)="deleteStation(station)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let _row; columns: displayedColumns;"></tr>
    </table>

  </mat-card-content>
</mat-card>
