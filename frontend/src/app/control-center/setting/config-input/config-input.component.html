<div class="config-input">
  @if (label()) {
    <label>{{ label() }}: </label>
  }
  <mat-form-field>
    <input matInput
           [type]="type()"
           [formControl]="control"
           [placeholder]="placeholder()"
    /></mat-form-field>

  @if (loading) {
    <small>loading...</small>
  }

  @if (saving) {
    <small>saving...</small>
  }
</div>
