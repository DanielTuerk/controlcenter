<h2 mat-dialog-title>Select new signal function</h2>
<mat-dialog-content>

  @for (func of functions(); track func; let i = $index) {
    <button matButton mat-dialog-close [mat-dialog-close]="func"
            [value]="func"
    >{{ func }}
    </button>
  }

  <br>
  <br>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Cancel</button>
</mat-dialog-actions>
