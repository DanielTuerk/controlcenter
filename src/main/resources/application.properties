home.dir=${user.home}/.cc

quarkus.application.name=controlcenter
quarkus.banner.path=cc-banner.txt

# selectrix4java uses the FFM API (java.lang.foreign) for its serial device access, which requires
# native access to be granted explicitly; Quarkus always loads dependencies on the classpath (unnamed
# module), so ALL-UNNAMED is the only value that actually takes effect here
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED


quarkus.scheduler.start-mode=forced

# for native image
quarkus.vertx.prefer-native-transport=false
quarkus.vertx.event-loops-pool-size=${CPU_COUNT:4}
quarkus.vertx.internal-blocking-pool-size=${CPU_COUNT:8}
quarkus.native.enable-http-url-handler=true
quarkus.vertx.max-event-loop-execute-time=10S
quarkus.vertx.warning-exception-time=10S
quarkus.native.additional-build-args=\
--initialize-at-build-time=java.nio,\
--initialize-at-build-time=sun.nio,\
--initialize-at-build-time=org.jboss.threads,\
--initialize-at-build-time=io.vertx.core,\
--initialize-at-build-time=io.netty.channel, \
--initialize-at-run-time=io.github.danieltuerk.selectrix4java.device.serial.ffm.LibC,\
--initialize-at-run-time=io.github.danieltuerk.selectrix4java.device.serial.ffm.win.Kernel32,\
--initialize-at-run-time=io.github.danieltuerk.selectrix4java.device.serial.ffm.win.Advapi32

quarkus.native.add-all-charsets=false


# Log settings
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %C{1}.%M(%F:%L) - %m%n
quarkus.log.category."io.github.danieltuerk.controlcenter".level=DEBUG
quarkus.log.category."io.github.danieltuerk.selectrix4java".level=DEBUG
quarkus.log.category."io.github.danieltuerk.selectrix4java".min-level=TRACE

# H2 database configuration (file-based)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${home.dir}/data/controlcenter-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=cc
quarkus.datasource.password=cc
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.jdbc.transactions=enabled
# Use this to control schema generation
quarkus.hibernate-orm.schema-management.strategy=validate
# Optional: disable loading import.sql
quarkus.hibernate-orm.sql-load-script=no-file
# Show SQL statements in logs
#quarkus.hibernate-orm.log.sql=true

# flyway
quarkus.flyway.migrate-at-start=true

# REST settings
quarkus.jackson.accept-case-insensitive-enums=true
quarkus.jackson.fail-on-unknown-properties=false
# Cache settings
quarkus.cache.caffeine."users".maximum-size=10000