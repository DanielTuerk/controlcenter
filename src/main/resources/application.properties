home.dir=${user.home}

quarkus.application.name=controlcenter
quarkus.banner.path=cc-banner.txt

# for native image
quarkus.vertx.prefer-native-transport=false
quarkus.vertx.event-loops-pool-size=${CPU_COUNT:4}
quarkus.vertx.internal-blocking-pool-size=${CPU_COUNT:8}
quarkus.native.enable-http-url-handler=true
quarkus.vertx.max-event-loop-execute-time=10S
quarkus.vertx.warning-exception-time=10S
quarkus.native.additional-build-args=\
--initialize-at-build-time=java.nio,\
--initialize-at-build-time=sun.nio,\
--initialize-at-build-time=org.jboss.threads,\
--initialize-at-build-time=io.vertx.core,\
--initialize-at-build-time=io.netty.channel

quarkus.native.add-all-charsets=false


# Log settings
#quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2}.%M:%L] %m%n
# nur im Dev-Profile verwenden
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %C{1}.%M(%F:%L) - %m%n
quarkus.log.category."net.wbz.moba".level=DEBUG
#quarkus.log.category."org.hibernate.SQL".level=DEBUG

# H2 database configuration (file-based)
quarkus.datasource.db-kind=h2
# TODO user home
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/controlcenter-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=cc
quarkus.datasource.password=cc
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.jdbc.transactions=enabled
# Use this to control schema generation
quarkus.hibernate-orm.schema-management.strategy=update
# Optional: disable loading import.sql
quarkus.hibernate-orm.sql-load-script=no-file
# Show SQL statements in logs
#quarkus.hibernate-orm.log.sql=true

# REST settings
quarkus.jackson.accept-case-insensitive-enums=true
quarkus.jackson.fail-on-unknown-properties=false
