<div class="footer-content">
  <button mat-stroked-button
          [textContent]="systemFormat"
          [disabled]="!isConnected"
          (click)="onSystemFormat()"></button>
  <mat-slide-toggle (change)="onRailVoltageToggle()"
                    [checked]="railVoltageEnabled"
                    [disabled]="!isConnected">Voltage</mat-slide-toggle>
  <mat-slide-toggle (change)="onRecordingToggle()"
                    [disabled]="!isConnected">Recording</mat-slide-toggle>
</div>
