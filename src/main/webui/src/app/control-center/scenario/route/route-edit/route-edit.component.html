<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ $route().id ? 'Edit' : 'Create' }} route</mat-card-title>
  </mat-card-header>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-card-content>
      <div>
        <label>Name: </label>
        <mat-form-field>
          <input matInput required [formControl]="form.controls.name"/>
        </mat-form-field>
      </div>
      <div>
        <label>Oneway: </label>
        <mat-checkbox [formControl]="form.controls.oneway"/>
      </div>
      <div>
        <label>Track: </label>

        <mat-button-toggle-group name="selectType"  (change)="onToggleChange($event)">
          <mat-button-toggle [value]="SELECT_TYPE.START">
            Start
          </mat-button-toggle>
          <mat-button-toggle [value]="SELECT_TYPE.END">
            End
          </mat-button-toggle>
          <mat-button-toggle [value]="SELECT_TYPE.WAYPOINT">
            Waypoint
          </mat-button-toggle>
        </mat-button-toggle-group>
        Status:
        @if (trackStatus) {
          <app-success-icon/>
        } @else {
          <app-error-icon/>
        }
        <app-track-viewer-svg
          *ngIf="showViewer"
          [overrideIsConnected]="true"
          (trackPartClicked)="onTrackPartClicked($event)"
          (trackPartsReady)="onTrackReady($event)"> style="overflow: auto">
        </app-track-viewer-svg>
        <br/>
      </div>
    </mat-card-content>
    <mat-card-footer>
      <button mat-stroked-button type="button" routerLink="/cc/scenario">Back</button>
      <button mat-stroked-button>Apply</button>
    </mat-card-footer>
  </form>
</mat-card>
