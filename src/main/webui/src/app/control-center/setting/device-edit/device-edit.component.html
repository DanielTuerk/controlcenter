<mat-card-header>
  <mat-card-title>Device</mat-card-title>
</mat-card-header>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-card-content>
    <div>
      <label>Key: </label>
      <mat-form-field>
        <input matInput required [formControl]="form.controls.key"/>
      </mat-form-field>
    </div>
    <div>
      <label>Type: </label>
      <mat-form-field>
        <mat-select required [formControl]="form.controls.type">
          @for (deviceType of DEVICE_TYPES; track deviceType) {
            <mat-option [value]="deviceType">{{deviceType}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div>
      available:
      <mat-icon (click)="reloadAvailableDevices()">refresh</mat-icon>
      <ul>
        <li *ngFor="let device of availableDevices()">
          {{ device.port }}: {{ device.name }}
        </li>
      </ul>

    </div>
  </mat-card-content>
  <mat-card-footer>
    <button mat-stroked-button type="button" routerLink="../">Back</button>
    <button mat-stroked-button>Apply</button>
  </mat-card-footer>
</form>
